[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cache-claim-audit"
version = "0.1.0"
description = "Offline-audit of documented cache-reuse promises against Python source."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
cache-claim-audit = "cache_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
